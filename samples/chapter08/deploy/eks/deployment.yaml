# samples/chapter08/deploy/eks/deployment.yaml
# Amazon EKS用Kubernetesマニフェスト（8-2-6節の完全版）
# Deployment + Service + HPA（Horizontal Pod Autoscaler）の最小構成
#
# 使い方（123456789012 は自身のAWSアカウントIDに置換すること）:
#   sed "s/123456789012/${AWS_ACCOUNT_ID}/g" deployment.yaml | kubectl apply -f -
#
# 注: ServiceタイプはClusterIP。外部公開にはIngressまたはLoadBalancerを別途設定する
apiVersion: v1
kind: ServiceAccount
metadata:
  name: my-agent
  # コンテナからAmazon Bedrockを呼び出す権限は、このServiceAccountにIAMロールを
  # 関連付けて与える（EKS Pod Identityで、Bedrockの呼び出しを許可したロールを割り当てる）
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-agent
  labels:
    app: my-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-agent
  template:
    metadata:
      labels:
        app: my-agent
    spec:
      serviceAccountName: my-agent
      containers:
        - name: agent
          # コンテナイメージ（123456789012 は自身のAWSアカウントIDに置換）
          image: 123456789012.dkr.ecr.ap-northeast-1.amazonaws.com/my-agent:latest
          ports:
            - containerPort: 8080
          env:
            - name: AWS_REGION
              # Bedrockを呼び出すリージョン
              value: "ap-northeast-1"
            - name: DATABASE_URL
              # DB接続文字列はSecretから取得する（コードやマニフェストに直書きしない）
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: database-url
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: my-agent-service
spec:
  selector:
    app: my-agent
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: my-agent-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: my-agent
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
